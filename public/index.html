<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>GreyIQ</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <aside class="bot-panel" aria-label="Bot roster and persona">
        <header class="brand-row">
          <div>
            <p class="eyebrow">Local AI Studio</p>
            <h1>GreyIQ</h1>
          </div>
          <button class="icon-button" id="newBotButton" type="button" title="New bot" aria-label="New bot">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14M5 12h14"></path>
            </svg>
          </button>
        </header>

        <section class="bot-list" id="botList" aria-label="Bots"></section>

        <form class="bot-editor" id="botEditor">
          <label>
            <span>Name</span>
            <input id="botName" name="name" maxlength="28" autocomplete="off">
          </label>

          <label>
            <span>Persona</span>
            <textarea id="botPersona" name="persona" rows="6"></textarea>
          </label>

          <div class="field-grid">
            <label>
              <span>Style</span>
              <select id="botStyle" name="style">
                <option value="direct">Direct</option>
                <option value="warm">Warm</option>
                <option value="technical">Technical</option>
                <option value="creative">Creative</option>
              </select>
            </label>

            <label>
              <span>Variation</span>
              <input id="botTemperature" name="temperature" type="range" min="0" max="100" step="1">
            </label>
          </div>

          <div class="swatch-row" id="swatchRow" aria-label="Bot color"></div>
        </form>
      </aside>

      <section class="chat-panel" aria-label="Chat">
        <header class="chat-header">
          <div class="bot-mark" id="activeBotMark">AI</div>
          <div>
            <p class="eyebrow" id="backendStatus">CPU ready</p>
            <h2 id="activeBotName">GreyIQ</h2>
          </div>
          <div class="header-actions">
            <button class="theme-toggle" id="themeToggle" type="button" aria-pressed="false" title="Switch theme">Dark</button>
            <div class="segmented" role="group" aria-label="Acceleration">
              <button id="cpuButton" class="segment is-active" type="button">CPU</button>
              <button id="gpuButton" class="segment" type="button">GPU</button>
            </div>
            <button class="icon-button" id="clearChatButton" type="button" title="Clear chat" aria-label="Clear chat">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 6h18"></path>
                <path d="M8 6V4h8v2"></path>
                <path d="M7 6l1 14h8l1-14"></path>
              </svg>
            </button>
          </div>
        </header>

        <div class="message-stream" id="messageStream" aria-live="polite"></div>

        <div class="agent-bar" id="agentBar">
          <button class="agent-toggle" id="agentToggle" type="button" aria-pressed="false" title="Let the brain read, edit, and run things in a workspace folder">Agent: off</button>
          <button class="agent-ws-button" id="agentWorkspace" type="button" title="Set the folder the agent works in">Workspace</button>
          <span class="agent-ws-path" id="agentWsPath">no workspace set</span>
        </div>

        <form class="composer" id="composer">
          <textarea id="promptInput" rows="2" placeholder="Message the bot"></textarea>
          <button class="send-button" id="sendButton" type="submit" title="Send" aria-label="Send">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M22 2 11 13"></path>
              <path d="m22 2-7 20-4-9-9-4 20-7Z"></path>
            </svg>
          </button>
        </form>
      </section>

      <aside class="training-panel" aria-label="Training">
        <header class="panel-header">
          <div>
            <p class="eyebrow">Training</p>
            <h2>Training Data</h2>
          </div>
          <button class="icon-button" id="trainButton" type="button" title="Train" aria-label="Train">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v18"></path>
              <path d="M5 8h14"></path>
              <path d="M7 14h10"></path>
              <path d="M9 20h6"></path>
            </svg>
          </button>
        </header>

        <form class="choice-form brain-form" id="brainForm">
          <label>
            <span>Coding brain</span>
            <select id="brainProvider" name="brainProvider">
              <option value="off">Off — local TinyGPT only</option>
              <option value="local">Local model (Ollama)</option>
              <option value="anthropic">Claude API</option>
              <option value="openai">OpenAI-compatible</option>
            </select>
          </label>
          <label data-brain-field="model">
            <span>Model</span>
            <input id="brainModel" name="brainModel" type="text" autocomplete="off" spellcheck="false" placeholder="e.g. qwen2.5-coder:14b">
          </label>
          <label data-brain-field="base_url">
            <span>Server URL</span>
            <input id="brainBaseUrl" name="brainBaseUrl" type="text" autocomplete="off" spellcheck="false" placeholder="http://127.0.0.1:11434/v1">
          </label>
          <label data-brain-field="api_key">
            <span>API key</span>
            <input id="brainApiKey" name="brainApiKey" type="password" autocomplete="off" placeholder="paste API key">
          </label>
          <div class="folder-actions" id="brainModelRow" hidden>
            <span class="folder-status" id="brainModelStatus">checking model…</span>
            <button class="text-button" type="button" id="brainDownload">Download model</button>
          </div>
          <div class="folder-actions">
            <button class="text-button" type="button" id="brainTest">Test</button>
            <button class="text-button" type="submit" id="brainSave">Save brain</button>
          </div>
          <p class="folder-status" id="brainStatus" aria-live="polite"></p>
        </form>

        <form class="choice-form" id="choiceForm">
          <label>
            <span>Preference</span>
            <textarea id="choiceInput" rows="4" placeholder="I prefer short answers with concrete next steps."></textarea>
          </label>
          <button class="text-button" type="submit">Add preference</button>
        </form>

        <form class="choice-form" id="trainingDataForm">
          <label>
            <span>Source</span>
            <select id="trainingDataSource" name="trainingDataSource"></select>
          </label>
          <label>
            <span>Training data</span>
            <textarea id="trainingDataInput" rows="5" placeholder="Paste notes, examples, facts, preferred answers, or source text."></textarea>
          </label>
          <button class="text-button" type="submit">Add training data</button>
        </form>

        <form class="choice-form" id="trainingFolderForm">
          <label>
            <span>Add a local folder</span>
            <input id="trainingFolderInput" name="trainingFolder" type="text" autocomplete="off" spellcheck="false" placeholder="Choose a folder, or paste its path">
          </label>
          <div class="folder-actions">
            <button class="text-button" type="button" id="trainingFolderBrowse" hidden>Choose folder…</button>
            <button class="text-button" type="submit" id="trainingFolderSubmit">Add folder</button>
          </div>
          <p class="folder-status" id="trainingFolderStatus" aria-live="polite"></p>
        </form>

        <div class="source-heading">Train on</div>
        <section class="source-picker" id="trainingSourceList" aria-label="Training sources"></section>

        <section class="meter-wrap" aria-label="Training stats">
          <div class="meter-row">
            <span>Data</span>
            <strong id="trainingDataCount">0</strong>
          </div>
          <div class="meter-row">
            <span>Choices</span>
            <strong id="choiceCount">0</strong>
          </div>
          <div class="meter-row">
            <span>Model</span>
            <strong id="modelState">Fresh</strong>
          </div>
        </section>

        <section class="memory-list" id="memoryList" aria-label="Training memory"></section>
      </aside>

      <div class="workbench-divider" id="workbenchDivider" role="separator" aria-orientation="horizontal" aria-label="Resize workbench — drag, or focus and use the arrow keys" tabindex="0"></div>

      <section class="workbench" id="workbench" hidden aria-label="Agent workbench">
        <aside class="workbench-files">
          <div class="workbench-header">
            <strong>Workspace</strong>
            <button id="workspaceRefresh" type="button" title="Reload the file list">Refresh</button>
          </div>
          <input id="workspaceSearch" type="search" placeholder="Filter files" autocomplete="off" spellcheck="false" aria-label="Filter workspace files">
          <div id="workspaceTree" class="workspace-tree" role="tree" aria-label="Workspace files"></div>
        </aside>

        <section class="workbench-main">
          <div class="workbench-tabs">
            <div class="workbench-tablist" role="tablist" aria-label="Workbench panels">
              <button type="button" role="tab" id="wbtab-preview" aria-controls="filePreviewPanel" aria-selected="true" data-workbench-tab="preview" class="is-active">Preview</button>
              <button type="button" role="tab" id="wbtab-changes" aria-controls="changesPanel" aria-selected="false" tabindex="-1" data-workbench-tab="changes">Changes</button>
              <button type="button" role="tab" id="wbtab-steps" aria-controls="agentStepsPanel" aria-selected="false" tabindex="-1" data-workbench-tab="steps">Agent Steps</button>
              <button type="button" role="tab" id="wbtab-verify" aria-controls="verifyPanel" aria-selected="false" tabindex="-1" data-workbench-tab="verify">Verify</button>
            </div>
            <button type="button" id="workbenchMaximize" class="workbench-maximize" title="Maximize workbench" aria-label="Maximize workbench" aria-pressed="false">⤢</button>
          </div>

          <div id="filePreviewPanel" class="workbench-panel" role="tabpanel" aria-labelledby="wbtab-preview" tabindex="0"></div>
          <div id="changesPanel" class="workbench-panel" role="tabpanel" aria-labelledby="wbtab-changes" tabindex="0" hidden></div>
          <div id="agentStepsPanel" class="workbench-panel" role="tabpanel" aria-labelledby="wbtab-steps" tabindex="0" hidden></div>
          <div id="verifyPanel" class="workbench-panel" role="tabpanel" aria-labelledby="wbtab-verify" tabindex="0" hidden></div>
        </section>
      </section>
    </main>

    <template id="messageTemplate">
      <article class="message">
        <div class="message-meta"></div>
        <div class="message-body"></div>
        <div class="rating-bar">
          <button class="rate-button like" type="button" title="Prefer" aria-label="Prefer response">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 10v11"></path>
              <path d="M15 5 12 10h7l-2 11H8V10h4"></path>
            </svg>
          </button>
          <button class="rate-button dislike" type="button" title="Avoid" aria-label="Avoid response">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 14V3"></path>
              <path d="m15 19-3-5h7L17 3H8v11h4"></path>
            </svg>
          </button>
        </div>
      </article>
    </template>

    <script src="./app.js" type="module"></script>
  </body>
</html>
