name: CI

on:
  push:
    branches: [main, GreyNOC/bug-bounty-release]
  pull_request:
    branches: [main, GreyNOC/bug-bounty-release]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Syntax and dependency check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt

      # Separate file, and separate step, so the pip-audit gate below keeps auditing exactly the
      # runtime install list. pytest is the test RUNNER: `unittest discover` cannot collect the
      # module-level `def test_*` functions that 8 files use, so 59 tests -- the secret-reportability
      # classifier, the VDP policy gate and the VDP report gate among them -- ran nowhere.
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Audit dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          python -m pip install "pip-audit>=2.10,<3.0"
          python -m pip_audit -r requirements.txt

      - name: Run project checks
        run: npm run check
