name: CI

on:
  push:
    branches: [main, GreyNOC/bug-bounty-release]
  pull_request:
    branches: [main, GreyNOC/bug-bounty-release]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Syntax and dependency check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Audit dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          python -m pip install "pip-audit>=2.10,<3.0"
          python -m pip_audit -r requirements.txt

      - name: Run project checks
        run: npm run check

  debian-13:
    name: Debian 13 / system Python 3.13
    runs-on: ubuntu-24.04
    container: debian:13-slim
    steps:
      - name: Install Debian test prerequisites
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates git python3 python3-venv python3-pip >/dev/null

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify distribution Python
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 13), sys.version'

      - name: Install runtime and test dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.13,<3.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Run Python tests on Debian 13
        run: |
          . .venv/bin/activate
          python -B -m pytest -q backend
