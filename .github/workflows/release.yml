name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag push used to go straight from `pip install` to PyInstaller, so a
  # SIGNED release could be published from a commit whose tests had never run anywhere — the CI
  # workflow only triggers on push-to-main and pull_request, neither of which a tag is. This gate
  # runs the suite against the exact commit being shipped, and every build job depends on it, so a
  # failure stops the release before any asset or draft exists.
  #
  # ubuntu-latest deliberately: the 1x minute multiplier keeps a release affordable, and the
  # Windows-only PowerShell recipe case is already covered by the windows build job's own platform.
  gate:
    name: Quality gate (must pass before anything is built)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verify tag names the version in this exact checkout
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" != tag ] || [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Release ref $GITHUB_REF_NAME does not match package version v$version" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch, for the same asset-size reason the build jobs use it below.
          pip install "torch>=2.13,<3.0" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          npm ci

      - name: Run the quality gate
        run: npm run check

  windows:
    name: Build Windows portable + installer
    needs: gate
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # electron 44.x ships no install script, so `npm ci` never downloads the ~150 MB
      # Electron binary; electron-builder fetches it at the final step through got with a
      # 600 s TOTAL request deadline. A clean windows-latest runner therefore re-downloads
      # it every run, and a slow mirror can blow that deadline after the whole freeze is
      # done. Cache @electron/get's store so the fetch is a cache hit on every run but the
      # first, and pull it explicitly (below) BEFORE the expensive freeze either way.
      - name: Cache the Electron binary (@electron/get store)
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron\Cache
          key: electron-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-cache-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install npm dependencies + the Electron binary
        shell: pwsh
        # Ahead of the freeze on purpose: install.js has no got deadline and warms the cache
        # electron-builder reads, so a slow or failed download costs seconds here instead of a
        # discarded twenty-minute build at the last step. Mirrors build/build-portable.ps1.
        run: |
          npm ci
          node "node_modules/electron/install.js"
          if (-not (Test-Path "node_modules/electron/dist")) {
            throw "Electron not installed: node_modules/electron/dist is missing after install.js."
          }

      - name: Install Python runtime + build dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: the default Linux torch wheel bundles ~2.5 GB of CUDA
          # libraries, which (with Ollama's runtimes) push release assets past
          # GitHub's 2 GiB per-asset limit. The app only uses torch for the small
          # CPU TinyGPT model; coding-brain GPU acceleration comes via Ollama.
          pip install "torch>=2.13,<3.0" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -r build/requirements-build.txt

      - name: Install Playwright Chromium (bundled for proof screenshots)
        # Fetches the Chromium build that build/greyiq-backend.spec bundles under the app,
        # so screenshot capture works in the shipped release on a machine that never ran
        # `playwright install`. Must run before the freeze step.
        run: python -m playwright install chromium

      - name: Freeze backend (PyInstaller)
        run: pyinstaller --noconfirm --clean build/greyiq-backend.spec

      - name: Sanity-check frozen backend exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/greyiq-backend/greyiq-backend.exe")) {
            throw "Frozen backend not found at dist/greyiq-backend/greyiq-backend.exe"
          }

      - name: Smoke-test frozen backend (must answer /api/health)
        shell: pwsh
        run: |
          $env:GREYIQ_HOST = "127.0.0.1"
          $env:GREYIQ_PORT = "8799"
          $env:GREYIQ_RUNTIME_DIR = "$env:RUNNER_TEMP/greyiq-smoke"
          $proc = Start-Process -FilePath "dist/greyiq-backend/greyiq-backend.exe" -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 3
            if ($proc.HasExited) { throw "Frozen backend exited early (exit code $($proc.ExitCode)) — the bundle is broken." }
            try {
              $h = Invoke-WebRequest "http://127.0.0.1:8799/api/health" -UseBasicParsing -TimeoutSec 3
              if ($h.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          if (-not $ok) { throw "Frozen backend did not answer /api/health within 180s." }
          Write-Output "Frozen backend launched and answered /api/health."

      # npm ci + the Electron binary were installed before the freeze (above), so nothing
      # to do here. Ollama is NO LONGER bundled (it was ~1.4 GB / 86% of the old portable);
      # the app downloads it on demand to userData at first local-model use — see
      # electron/main.cjs ensureBaseOllama.

      - name: Build portable + installer (electron-builder)
        run: npx electron-builder --win portable nsis --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Authenticode signing is OPT-IN via repo secrets. When WINDOWS_CSC_LINK is
          # set (a base64-encoded .pfx) electron-builder auto-signs the portable, the
          # installer, and the inner app exe; when the secret is absent these render as
          # empty strings and electron-builder skips signing — the unsigned build is
          # unchanged. See docs/CODE_SIGNING.md.
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

      - name: List build artifacts
        shell: pwsh
        run: Get-ChildItem release -Filter *.exe | Select-Object Name, Length

      - name: Record Windows SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem release -Filter *.exe | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content release/SHA256SUMS-Windows.txt -Encoding ascii

      - name: Report Authenticode signing status
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            Write-Output "::warning::No WINDOWS_CSC_LINK secret set — release binaries are UNSIGNED (SmartScreen will warn). See docs/CODE_SIGNING.md."
          } else {
            Write-Output "Signing cert provided; verifying signatures on the built .exe files:"
            Get-ChildItem release -Filter *.exe | ForEach-Object {
              $sig = Get-AuthenticodeSignature $_.FullName
              Write-Output ("  {0}: {1} ({2})" -f $_.Name, $sig.Status, $sig.SignerCertificate.Subject)
              if ($sig.Status -ne 'Valid') { throw "Signature on $($_.Name) is $($sig.Status) — signing was requested but failed." }
            }
          }

      # NOTE: we intentionally do NOT upload the .exe files as Actions artifacts.
      # Each build is ~2.8 GB and Actions artifact storage is a small, quota-
      # limited bucket — accumulating these exhausts the quota and (because the
      # upload step ran before publishing) silently blocked the release. The
      # GitHub Release below carries the same files in separate storage that
      # does not count against the artifact quota, so the run-page copy is pure
      # redundant cost. Re-add a `continue-on-error` upload only if you ever
      # need the binaries on the run page for debugging.

      # Upload to a DRAFT release. GitHub releases may become immutable once published,
      # which would block the Linux job from appending its assets afterward. Publication
      # is a separate human operator action after reviewing every build and asset.
      - name: Upload Windows assets to the draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: GreyIQ ${{ github.ref_name }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release/GreyIQ-*-portable.exe
            release/GreyIQ-Setup-*.exe
            release/SHA256SUMS-Windows.txt

  linux:
    name: Build Linux GUI (AppImage + Debian package) + headless CLI
    # Runs after windows so the DRAFT release already exists; this job appends the
    # Linux assets to that draft. Only a human operator may publish it.
    needs: windows
    # Build native libraries against an older glibc than Debian 13. A rolling
    # ubuntu-latest runner can otherwise produce binaries too new for Trixie.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # ubuntu-latest ships only ~14 GB free; the torch PyInstaller dist plus the
      # Ollama .tar.zst (bundled CUDA/ROCm libs) + AppImage exhaust it ("No space
      # left on device"). Reclaim ~30 GB of preinstalled toolchains we don't use.
      - name: Free up disk space for the heavy build
        run: |
          echo "Disk before cleanup:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "Disk after cleanup:"; df -h /

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # See the Windows job: electron 44.x ships no install script, so the Electron binary
      # is downloaded lazily by electron-builder unless we pull it first. Cache the
      # @electron/get store (~/.cache/electron on Linux) and fetch explicitly before the freeze.
      - name: Cache the Electron binary (@electron/get store)
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-cache-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install npm dependencies + the Electron binary
        # Ahead of the freeze on purpose: install.js has no got deadline and warms the cache
        # electron-builder reads, so a slow or failed download costs seconds here instead of a
        # discarded build at the last step.
        run: |
          npm ci
          node node_modules/electron/install.js
          test -d node_modules/electron/dist || { echo "Electron not installed: node_modules/electron/dist missing after install.js."; exit 1; }

      - name: Install Python runtime + build dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: the default Linux torch wheel bundles ~2.5 GB of CUDA
          # libraries, which (with Ollama's runtimes) push release assets past
          # GitHub's 2 GiB per-asset limit. The app only uses torch for the small
          # CPU TinyGPT model; coding-brain GPU acceleration comes via Ollama.
          pip install "torch>=2.13,<3.0" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -r build/requirements-build.txt

      - name: Install Playwright Chromium (bundled for proof screenshots)
        # Fetches the Chromium build that build/greyiq-backend.spec bundles under the app,
        # so screenshot capture works in the shipped release on a machine that never ran
        # `playwright install`. Must run before the freeze step.
        run: python -m playwright install chromium

      - name: Freeze backend (PyInstaller)
        run: pyinstaller --noconfirm --clean build/greyiq-backend.spec

      - name: Sanity-check frozen backend exists
        run: |
          if [ ! -x dist/greyiq-backend/greyiq-backend ]; then
            echo "Frozen backend not found at dist/greyiq-backend/greyiq-backend"
            exit 1
          fi

      - name: Smoke-test frozen backend (must answer /api/health)
        run: |
          export GREYIQ_HOST=127.0.0.1 GREYIQ_PORT=8799 GREYIQ_RUNTIME_DIR="$RUNNER_TEMP/greyiq-smoke"
          ./dist/greyiq-backend/greyiq-backend &
          PID=$!
          ok=0
          for i in $(seq 1 60); do
            sleep 3
            if ! kill -0 "$PID" 2>/dev/null; then echo "Frozen backend exited early — the bundle is broken."; exit 1; fi
            if curl -fsS "http://127.0.0.1:8799/api/health" >/dev/null 2>&1; then ok=1; break; fi
          done
          kill "$PID" 2>/dev/null || true
          if [ "$ok" -ne 1 ]; then echo "Frozen backend did not answer /api/health within 180s."; exit 1; fi
          echo "Frozen backend launched and answered /api/health."

      # npm ci + the Electron binary were installed before the freeze (above). Ollama is NO
      # LONGER bundled — downloaded on demand at first local-model use (electron/main.cjs
      # ensureBaseOllama), which also frees the ~1.4 GB that previously contributed to the
      # runner's "No space left on device" pressure.

      - name: Ensure Debian packaging compressor
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xz-utils binutils

      - name: Build Linux GUI (electron-builder AppImage + deb)
        run: |
          chmod +x build/greyiq-cli
          npx electron-builder --linux AppImage deb --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke-test Debian 13 package and desktop
        run: bash scripts/smoke-debian13.sh

      - name: Package headless CLI (frozen backend tarball)
        run: |
          bash scripts/package-linux-cli.sh

      - name: Smoke-test headless CLI archive
        run: bash scripts/smoke-cli-archive.sh

      - name: List build artifacts
        run: ls -lh release || true

      - name: Record Linux SHA-256 checksums
        run: |
          cd release
          sha256sum GreyIQ-*.AppImage GreyIQ-*.deb GreyIQ-*-linux-cli.tar.gz > SHA256SUMS-Linux.txt

      - name: Append Linux assets to the draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: GreyIQ ${{ github.ref_name }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release/GreyIQ-*.AppImage
            release/GreyIQ-*.deb
            release/GreyIQ-*-linux-cli.tar.gz
            release/SHA256SUMS-Linux.txt
