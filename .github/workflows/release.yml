name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/version label for the release (e.g. v0.3.0)'
        required: true
        default: 'v0.0.0-dev'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows portable + installer
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python runtime + build dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: the default Linux torch wheel bundles ~2.5 GB of CUDA
          # libraries, which (with Ollama's runtimes) push release assets past
          # GitHub's 2 GiB per-asset limit. The app only uses torch for the small
          # CPU TinyGPT model; coding-brain GPU acceleration comes via Ollama.
          pip install "torch>=2.2,<2.8" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -r build/requirements-build.txt

      - name: Freeze backend (PyInstaller)
        run: pyinstaller --noconfirm --clean build/greyiq-backend.spec

      - name: Sanity-check frozen backend exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/greyiq-backend/greyiq-backend.exe")) {
            throw "Frozen backend not found at dist/greyiq-backend/greyiq-backend.exe"
          }

      - name: Smoke-test frozen backend (must answer /api/health)
        shell: pwsh
        run: |
          $env:GREYIQ_HOST = "127.0.0.1"
          $env:GREYIQ_PORT = "8799"
          $env:GREYIQ_RUNTIME_DIR = "$env:RUNNER_TEMP/greyiq-smoke"
          $proc = Start-Process -FilePath "dist/greyiq-backend/greyiq-backend.exe" -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 3
            if ($proc.HasExited) { throw "Frozen backend exited early (exit code $($proc.ExitCode)) — the bundle is broken." }
            try {
              $h = Invoke-WebRequest "http://127.0.0.1:8799/api/health" -UseBasicParsing -TimeoutSec 3
              if ($h.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          if (-not $ok) { throw "Frozen backend did not answer /api/health within 180s." }
          Write-Output "Frozen backend launched and answered /api/health."

      - name: Install npm dependencies
        run: npm ci

      # Ollama is NO LONGER bundled (it was ~1.4 GB / 86% of the old portable). The
      # app downloads it on demand to userData the first time the local model is
      # selected — see electron/main.cjs ensureBaseOllama.

      - name: Build portable + installer (electron-builder)
        run: npx electron-builder --win portable nsis --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build artifacts
        shell: pwsh
        run: Get-ChildItem release -Filter *.exe | Select-Object Name, Length

      # NOTE: we intentionally do NOT upload the .exe files as Actions artifacts.
      # Each build is ~2.8 GB and Actions artifact storage is a small, quota-
      # limited bucket — accumulating these exhausts the quota and (because the
      # upload step ran before publishing) silently blocked the release. The
      # GitHub Release below carries the same files in separate storage that
      # does not count against the artifact quota, so the run-page copy is pure
      # redundant cost. Re-add a `continue-on-error` upload only if you ever
      # need the binaries on the run page for debugging.

      # Upload to a DRAFT release. GitHub releases become immutable once published,
      # which blocks the linux job from appending its assets afterward. So both
      # platform jobs upload while the release is still a draft, and a final
      # `publish` job flips it to published once every asset is attached.
      - name: Upload Windows assets to the draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          name: GreyIQ ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release/GreyIQ-*-portable.exe
            release/GreyIQ-Setup-*.exe

  linux:
    name: Build Linux GUI (AppImage) + headless CLI
    # Runs after windows so the DRAFT release already exists; this job appends the
    # Linux assets to that draft (the `publish` job publishes it once both finish).
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # ubuntu-latest ships only ~14 GB free; the torch PyInstaller dist plus the
      # Ollama .tar.zst (bundled CUDA/ROCm libs) + AppImage exhaust it ("No space
      # left on device"). Reclaim ~30 GB of preinstalled toolchains we don't use.
      - name: Free up disk space for the heavy build
        run: |
          echo "Disk before cleanup:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "Disk after cleanup:"; df -h /

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python runtime + build dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: the default Linux torch wheel bundles ~2.5 GB of CUDA
          # libraries, which (with Ollama's runtimes) push release assets past
          # GitHub's 2 GiB per-asset limit. The app only uses torch for the small
          # CPU TinyGPT model; coding-brain GPU acceleration comes via Ollama.
          pip install "torch>=2.2,<2.8" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -r build/requirements-build.txt

      - name: Freeze backend (PyInstaller)
        run: pyinstaller --noconfirm --clean build/greyiq-backend.spec

      - name: Sanity-check frozen backend exists
        run: |
          if [ ! -x dist/greyiq-backend/greyiq-backend ]; then
            echo "Frozen backend not found at dist/greyiq-backend/greyiq-backend"
            exit 1
          fi

      - name: Smoke-test frozen backend (must answer /api/health)
        run: |
          export GREYIQ_HOST=127.0.0.1 GREYIQ_PORT=8799 GREYIQ_RUNTIME_DIR="$RUNNER_TEMP/greyiq-smoke"
          ./dist/greyiq-backend/greyiq-backend &
          PID=$!
          ok=0
          for i in $(seq 1 60); do
            sleep 3
            if ! kill -0 "$PID" 2>/dev/null; then echo "Frozen backend exited early — the bundle is broken."; exit 1; fi
            if curl -fsS "http://127.0.0.1:8799/api/health" >/dev/null 2>&1; then ok=1; break; fi
          done
          kill "$PID" 2>/dev/null || true
          if [ "$ok" -ne 1 ]; then echo "Frozen backend did not answer /api/health within 180s."; exit 1; fi
          echo "Frozen backend launched and answered /api/health."

      - name: Install npm dependencies
        run: npm ci

      # Ollama is NO LONGER bundled — downloaded on demand at first local-model use
      # (electron/main.cjs ensureBaseOllama). This also frees the ~1.4 GB that
      # previously contributed to the runner's "No space left on device" pressure.

      - name: Build Linux GUI (electron-builder AppImage)
        run: npx electron-builder --linux AppImage --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package headless CLI (frozen backend tarball)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          tar -czf "release/GreyIQ-${VERSION}-linux-cli.tar.gz" -C dist greyiq-backend
          echo "CLI tarball: release/GreyIQ-${VERSION}-linux-cli.tar.gz ($(du -h release/GreyIQ-${VERSION}-linux-cli.tar.gz | cut -f1))"

      - name: List build artifacts
        run: ls -lh release || true

      - name: Append Linux assets to the draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          name: GreyIQ ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release/GreyIQ-*.AppImage
            release/GreyIQ-*-linux-cli.tar.gz

  publish:
    name: Publish the release (flip draft -> published)
    # Runs only after BOTH platform builds have uploaded their assets to the draft,
    # so the single publish event freezes an immutable release carrying every asset.
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Flip the draft release to published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          gh release edit "$TAG" \
            --repo "${{ github.repository }}" \
            --draft=false \
            --latest
